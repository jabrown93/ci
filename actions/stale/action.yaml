---
# Composite action: close stale issues and PRs (wraps actions/stale). Defaults
# match the per-repo stale workflow the Homebridge plugins carried; every knob
# is overridable.
#
# The CALLER supplies the schedule trigger and MUST grant the permissions
# actions/stale needs (a composite action cannot declare job-level permissions):
#   permissions:
#     issues: write
#     pull-requests: write
#     actions: write        # prune the action's own caches
name: Close stale issues and PRs
description: >-
  Wrap actions/stale with the shared jabrown93 defaults. The caller supplies the
  schedule trigger and the issues/pull-requests/actions write permissions.
inputs:
  days-before-stale:
    required: false
    default: '30'
  days-before-close:
    required: false
    default: '7'
  stale-issue-message:
    required: false
    default: This issue has no recent activity and will be closed in 7 days. Comment to keep the issue open.
  stale-pr-message:
    required: false
    default: This PR has no recent activity and will be closed in 7 days. Comment or update to keep the PR open.
  stale-issue-label:
    required: false
    default: stale
  stale-pr-label:
    required: false
    default: no-pr-activity
  exempt-issue-labels:
    required: false
    default: work-in-progress,disable-stale-bot,needs-triage
  exempt-pr-labels:
    required: false
    default: work-in-progress,disable-stale-bot,needs-triage
  close-issue-message:
    required: false
    default: No activity in over 30 days, closing.
  close-pr-message:
    required: false
    default: No activity in over 30 days, closing.
runs:
  using: composite
  steps:
    - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
      with:
        days-before-stale: ${{ inputs.days-before-stale }}
        days-before-close: ${{ inputs.days-before-close }}
        stale-issue-message: ${{ inputs.stale-issue-message }}
        stale-pr-message: ${{ inputs.stale-pr-message }}
        stale-issue-label: ${{ inputs.stale-issue-label }}
        stale-pr-label: ${{ inputs.stale-pr-label }}
        exempt-issue-labels: ${{ inputs.exempt-issue-labels }}
        exempt-pr-labels: ${{ inputs.exempt-pr-labels }}
        close-issue-message: ${{ inputs.close-issue-message }}
        close-pr-message: ${{ inputs.close-pr-message }}
