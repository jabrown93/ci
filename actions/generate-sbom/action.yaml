---
# Composite action: generate CycloneDX AND SPDX SBOMs of the checked-out repo's
# resolved dependencies and upload both as one workflow artifact.
#
# Two formats because consumers of an SBOM are split: CycloneDX is what the
# vulnerability/licence tooling reads, SPDX is what most compliance consumers
# and GitHub's own dependency surface expect. Emitting both here means a caller
# never has to run two generators over the same tree.
#
# ALWAYS run this on a hosted runner. `npm ci` and `mvn` execute dependency
# lifecycle scripts and build plugins; that code is UNTRUSTED.
#
# The caller checks out the repo first, so it controls fetch-depth.
#
# The artifact always holds sbom.cdx.json and sbom.spdx.json at its ROOT, so
# consumers never parameterize the filenames -- only this generator knows where
# each was written. That needs an explicit staging dir: upload-artifact flattens
# to the basename only for a SINGLE path, and roots a multi-path upload at the
# least common ancestor instead -- which would ship Maven's SBOM as
# target/sbom.cdx.json.
#
# The CycloneDX half is ecosystem-native (cyclonedx-npm, cyclonedx-maven) so it
# reports the RESOLVED dependency graph. The SPDX half is a single syft
# filesystem scan for every ecosystem, run AFTER the ecosystem steps so it sees
# what they installed -- one step beats three near-identical ones.
#
# That makes SPDX fidelity ecosystem-dependent: npm gets the resolved tree from
# node_modules, but `cyclonedx:makeAggregateBom` never packages, so a maven run
# leaves no jars for syft and its SPDX covers only pom-declared dependencies.
# Use the CycloneDX output for maven dependency analysis. Fixable with a
# `mvn dependency:copy-dependencies` step if a maven consumer ever needs it.
name: Generate CycloneDX and SPDX SBOMs
description: >-
  Generate CycloneDX and SPDX SBOMs of the checked-out repo's resolved
  dependencies (npm, maven, or a syft filesystem scan) and upload both as a
  workflow artifact.
inputs:
  ecosystem:
    description: 'Dependency ecosystem: npm, maven, or syft (filesystem scan).'
    required: true
  sbom-path:
    description: >-
      Path the generator writes the SBOM to. Maven emits under target/ per the
      pom's cyclonedx-maven-plugin outputName, so maven callers normally pass
      target/sbom.cdx.json. The path is a property of the caller's build config,
      not something this action can infer.
    required: false
    default: sbom.cdx.json
  spdx-path:
    description: >-
      Path the SPDX SBOM is written to. Unlike sbom-path this is always produced
      by the same syft scan regardless of ecosystem, so the default rarely needs
      overriding.
    required: false
    default: sbom.spdx.json
  artifact-name:
    description: Name of the uploaded artifact (holds both SBOMs).
    required: false
    default: sbom
  node-version:
    description: Node.js version (ecosystem npm).
    required: false
    default: '24'
  cyclonedx-npm-version:
    description: Version of @cyclonedx/cyclonedx-npm to run (ecosystem npm).
    required: false
    default: 4.2.1
  java-version:
    description: JDK version (ecosystem maven).
    required: false
    default: '25'
  java-distribution:
    description: JDK distribution (ecosystem maven).
    required: false
    default: corretto
runs:
  using: composite
  steps:
    - name: Validate ecosystem
      # Fail loudly here rather than silently uploading nothing: every generate
      # step below is `if`-gated, so an unknown value would skip them all and
      # only surface as upload-artifact's if-no-files-found.
      shell: bash
      env:
        ECOSYSTEM: ${{ inputs.ecosystem }}
      run: |
        set -euo pipefail
        case "${ECOSYSTEM}" in
          npm | maven | syft) ;;
          *)
            echo "::error::unsupported ecosystem '${ECOSYSTEM}' (expected: npm, maven, syft)"
            exit 1
            ;;
        esac

    - name: Set up Node.js
      if: inputs.ecosystem == 'npm'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install dependencies
      if: inputs.ecosystem == 'npm'
      shell: bash
      run: npm ci

    - name: Generate CycloneDX SBOM (npm)
      if: inputs.ecosystem == 'npm'
      shell: bash
      env:
        CYCLONEDX_NPM_VERSION: ${{ inputs.cyclonedx-npm-version }}
        SBOM_PATH: ${{ inputs.sbom-path }}
      run: |
        set -euo pipefail
        # --ignore-npm-errors: a messy dependency tree (an invalid peer) must not
        # abort generation.
        npx --yes "@cyclonedx/cyclonedx-npm@${CYCLONEDX_NPM_VERSION}" \
          --ignore-npm-errors \
          --output-format JSON \
          --output-file "${SBOM_PATH}"

    - name: Set up JDK
      if: inputs.ecosystem == 'maven'
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}
        cache: maven

    - name: Generate CycloneDX SBOM (maven)
      if: inputs.ecosystem == 'maven'
      shell: bash
      # Aggregate BOM so a multi-module build reports one SBOM for the whole
      # reactor. Output name/format come from the pom's plugin configuration.
      run: mvn -B cyclonedx:makeAggregateBom

    - name: Generate CycloneDX SBOM (syft)
      if: inputs.ecosystem == 'syft'
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        path: .
        format: cyclonedx-json
        output-file: ${{ inputs.sbom-path }}
        # This action uploads its own artifact under a generated name by default;
        # the step below owns the upload so the name is stable for consumers.
        upload-artifact: false

    - name: Generate SPDX SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        path: .
        format: spdx-json
        output-file: ${{ inputs.spdx-path }}
        # This action uploads its own artifact under a generated name by default;
        # the step below owns the upload so the name is stable for consumers.
        upload-artifact: false

    # Both SBOMs into one dir so the artifact is rooted there and each file keeps
    # its basename, whatever path the generator wrote it to.
    - name: Stage SBOMs
      shell: bash
      env:
        SBOM_PATH: ${{ inputs.sbom-path }}
        SPDX_PATH: ${{ inputs.spdx-path }}
      run: |
        set -euo pipefail
        # rm first: RUNNER_TEMP persists across steps, so a second invocation in
        # the same job would otherwise upload the first one's SBOMs too.
        rm -rf "${RUNNER_TEMP}/sbom"
        mkdir -p "${RUNNER_TEMP}/sbom"
        cp "${SBOM_PATH}" "${SPDX_PATH}" "${RUNNER_TEMP}/sbom/"

    - name: Upload SBOM artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        if-no-files-found: error
        path: ${{ runner.temp }}/sbom
