---
# Composite action: build, push, and keylessly sign a multi-arch Docker image
# to GHCR, then attach both SBOM formats as OCI referrers.
#
# WHY THIS IS A COMPOSITE ACTION, NOT A JOB IN docker-release.yml:
#
# Cosign's keyless signing asks Fulcio for a short-lived cert whose SAN is the
# OIDC identity of the WORKFLOW FILE that requested the token. For a
# workflow_call reusable workflow, that identity is the REUSABLE workflow's own
# path -- `jabrown93/ci/.github/workflows/docker-release.yml@<ref>` -- and it
# is IDENTICAL no matter which repo invokes it, because `docker-release.yml`
# is public and any GitHub repo can call it. A Kyverno policy that verifies the
# keyless signature and pins that SAN would therefore accept an image built by
# ANY caller of this workflow, not just `jabrown93` repos -- the SAN proves
# nothing about who actually produced the image.
#
# A composite action is invoked with `uses:` at the STEP level, so its steps
# always run as part of the CALLER's own job. The OIDC token minted for that
# job -- and therefore the Fulcio SAN -- reflects the CALLER's own workflow
# file and ref (e.g. `jabrown93/crosswatch/.github/workflows/release.yml@refs/heads/main`),
# which Kyverno CAN pin to trust only this org's own repos.
#
# For that identity to be meaningful, the job invoking this action MUST live
# directly in the calling repo's own workflow file -- not inside another
# reusable workflow this repo doesn't control. See this repo's README for the
# required caller-side job.
#
# The image carries both SBOM formats as OCI referrers: SPDX from buildx
# (`sbom: true`), CycloneDX from a syft scan attested with cosign. BuildKit
# cannot emit CycloneDX, hence the second pass.
name: Build, sign and push Docker image
description: >-
  Build a multi-arch Docker image, push it to GHCR, keylessly sign it with
  cosign, and attach SPDX (buildx) + CycloneDX (syft, cosign-attested) SBOMs.
  Runs in the caller's own job so the cosign/Fulcio identity is the caller's,
  not this repo's.
inputs:
  image:
    description: Full image ref to build, e.g. ghcr.io/jabrown93/crosswatch
    required: true
  version:
    description: Version to build and tag, WITHOUT the leading v (e.g. 1.2.3)
    required: true
  channel:
    description: >-
      semantic-release release channel. "beta" tags the image :beta; any other
      value (including empty, for the default channel) tags it :latest.
    required: false
    default: ""
  dockerfile:
    description: Path to the Dockerfile
    required: false
    default: ./Dockerfile
  context:
    description: Docker build context
    required: false
    default: .
  platforms:
    description: Comma-separated target platforms
    required: false
    default: linux/amd64,linux/arm64
  build-args:
    description: >-
      Extra newline-separated build-args, appended after the automatic
      APP_VERSION=v<version> arg.
    required: false
    default: ""
  github-token:
    description: Token used to authenticate to GHCR (ghcr.io) for the push
    required: true
outputs:
  digest:
    description: Digest of the pushed image (sha256:...)
    value: ${{ steps.build.outputs.digest }}
runs:
  using: composite
  steps:
    - name: Checkout release tag
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Build the tag semantic-release just created, not the pushed commit,
        # so the image matches exactly what was released.
        ref: v${{ inputs.version }}
        persist-credentials: false

    - name: Plan tags
      id: meta
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        VERSION: ${{ inputs.version }}
        CHANNEL: ${{ inputs.channel }}
      run: |
        set -euo pipefail
        if [[ "${CHANNEL}" == "beta" ]]; then
          tags="${IMAGE}:beta,${IMAGE}:v${VERSION}"
        else
          tags="${IMAGE}:latest,${IMAGE}:v${VERSION}"
        fi
        echo "tags=${tags}" >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      # No `platforms:` input: this action's platforms are binfmt arch
      # names (e.g. arm64,riscv64), not the Buildx OCI target descriptors
      # (linux/arm64) `inputs.platforms` holds, so it defaults to `all`.
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Build and push image
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: true
        platforms: ${{ inputs.platforms }}
        build-args: |
          APP_VERSION=v${{ inputs.version }}
          ${{ inputs.build-args }}
        tags: ${{ steps.meta.outputs.tags }}
        provenance: mode=max
        sbom: true
        cache-from: type=gha
        # ignore-error: the cache EXPORT runs after the image has already been
        # pushed, so a cache-backend hiccup there must not fail this step and
        # skip the signing/attestation steps below over an image that already
        # exists in the registry.
        cache-to: type=gha,mode=max,ignore-error=true

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: "v3.1.3"

    - name: Sign image (keyless)
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        set -euo pipefail
        if [ -z "${DIGEST}" ]; then
          echo "::error::build-push-action produced no digest; cannot sign image" >&2
          exit 1
        fi
        cosign sign --yes "${IMAGE}@${DIGEST}"

    # buildx `sbom: true` above already attached an SPDX SBOM -- BuildKit's
    # attestation is SPDX-only and cannot emit CycloneDX. This adds the
    # CycloneDX half, so both formats hang off the same digest.
    #
    # syft resolves a multi-arch index to one manifest, so the CycloneDX SBOM
    # describes a single architecture while buildx's SPDX is per-platform.
    # Acceptable: these images differ only by compiled arch, not package set.
    - name: Generate CycloneDX SBOM
      uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      env:
        # syft's file-metadata cataloger defaults to `owned-by-package`, which emits a
        # CycloneDX `type: file` component -- name, sha1, sha256, no purl, no license --
        # for every package-owned file in the image. They cannot match a vulnerability
        # and cannot carry a license, so they are pure ballast: measured elsewhere at
        # 7,265 of 7,506 components on one image and 15,521 of 16,399 on another.
        SYFT_FILE_METADATA_SELECTION: none
        # Go modules, npm packages and Python distributions frequently ship no license
        # metadata syft can read from the image alone, so they arrive with no license.
        # Enrichment resolves them from the upstream registries at scan time.
        # Best-effort: an unreachable registry degrades license coverage rather than
        # failing the build.
        SYFT_ENRICH: golang,javascript,python
        # Pinned, not corrective. `enrich: python` feeds one switch to two settings --
        # remote license lookup AND guess-unpinned-requirements, which invents a
        # version for each unpinned requirements.txt entry and would feed fabricated
        # versions into vulnerability matching. Today it cannot reach that setting,
        # but the asymmetry looks accidental, so the value is made explicit here.
        SYFT_PYTHON_GUESS_UNPINNED_REQUIREMENTS: 'false'
      with:
        # Digest, never the tag: the tag can move between the push and this scan.
        image: ${{ inputs.image }}@${{ steps.build.outputs.digest }}
        format: cyclonedx-json
        output-file: sbom.cdx.json
        upload-artifact: false

    - name: Attach CycloneDX SBOM attestation (keyless)
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${IMAGE}@${DIGEST}"
