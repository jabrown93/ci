---
# Composite action: mint a GitHub App token and check out the branch TIP
# (fetch-depth 0) for a semantic-release job, exposing the token for the release
# step. Extracted from the identical preamble in docker-release.yml and
# npm-release.yml.
#
# Checks out `github.ref` (the branch tip), NOT github.sha: with concurrency
# queueing, a queued run otherwise operates on its trigger SHA and its push is
# rejected as non-fast-forward once an earlier queued run has already advanced
# the branch. Pulling the tip turns redundant queued runs into no-ops instead.
#
# IMPORTANT: a reusable workflow must reference this action by its FULL pinned
# ref (jabrown93/ci/actions/release-checkout@<sha>), NOT `./actions/release-checkout`
# -- a local `./` ref used from inside a reusable workflow resolves against the
# CALLER's checked-out repo, not this one, so it would not be found.
name: Release checkout
description: >-
  Mint a GitHub App token and check out the branch tip (fetch-depth 0) for a
  semantic-release job; outputs the token for the release step.
inputs:
  app-id:
    description: GitHub App client id used to mint the release token
    required: true
  app-private-key:
    description: GitHub App private key
    required: true
  fetch-depth:
    description: Checkout fetch depth (0 = full history + tags, for semantic-release)
    required: false
    default: '0'
outputs:
  token:
    description: The minted GitHub App installation token, for the release step
    value: ${{ steps.app-token.outputs.token }}
runs:
  using: composite
  steps:
    - name: Generate app token
      id: app-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}

    - name: Checkout branch tip
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        persist-credentials: true
        token: ${{ steps.app-token.outputs.token }}
        ref: ${{ github.ref }}
