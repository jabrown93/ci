---
# Reusable workflow: semantic-release for an npm package, authenticating as a
# GitHub App and publishing to npm with provenance via OIDC trusted publishing.
#
# IMPORTANT: npm trusted publishing matches on the *caller* workflow's repo and
# entry-point filename, so consumers must keep their caller workflow named
# `release.yaml`/`release.yml` (whatever is registered on npmjs.org) and trigger
# it on push to the release branches. Concurrency is left to the caller.
name: Release
on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used for the release job
        required: false
        type: string
        default: '24'
    secrets:
      APP_ID:
        description: GitHub App ID used to mint the release token
        required: true
      APP_PRIVATE_KEY:
        description: GitHub App private key
        required: true
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Skip only on our own [skip ci] version-bump commits. github.event.head_commit
    # is unset on non-push events (schedule/dispatch), so this is safe there too.
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for trusted publishing and npm provenance
    steps:
      # Mint the release app token + check out the branch TIP (fetch-depth 0).
      # Full pinned ref, not ./actions/release-checkout: a local `./` ref used
      # from inside a reusable workflow resolves against the CALLER's checkout,
      # not this repo, so it would not be found.
      - name: Release checkout
        id: rc
        uses: jabrown93/ci/actions/release-checkout@e24efb41d2e9a9f32af4521567f59911f2bbf7f4 # release-checkout-v1.0.1
        with:
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm clean-install
      - run: npm audit signatures
      - name: Configure atomic git pushes
        run: git config --global push.atomic true
      - run: npm run semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.rc.outputs.token }}
          GH_TOKEN: ${{ steps.rc.outputs.token }}
          # Read by a consumer's .releaserc.js to promote suppressed fix(deps)
          # commits (routine dependency bumps) into a single patch release on
          # the caller's weekly schedule trigger, instead of on every push.
          # Also true on workflow_dispatch, so a manually-triggered run (e.g.
          # to sweep a non-default release branch a schedule can't reach) acts
          # as an on-demand version of the same promotion. A consumer without
          # that opt-in config simply ignores this. See the README's "Weekly
          # dependency releases" section.
          RELEASE_DEPS: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
