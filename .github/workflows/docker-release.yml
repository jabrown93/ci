---
# Reusable workflow: semantic-release for a Docker-image repo, authenticating
# as a GitHub App, then building/pushing/signing a multi-arch image to GHCR.
#
# The image carries both SBOM formats as OCI referrers: SPDX from buildx
# (`sbom: true`), CycloneDX from a syft scan attested with cosign. BuildKit
# cannot emit CycloneDX, hence the second pass.
#
# Two jobs so a build/push/sign failure never strands a tagged-but-imageless
# release: `image` only runs once `release` has published, and re-running just
# the failed job (GitHub's "re-run failed jobs") reuses `release`'s outputs
# instead of re-evaluating semantic-release.
#
# Trigger events, concurrency, and the version-bump-in-repo step (if any) stay
# in the caller — see jabrown93/AURA/.github/workflows/release.yml and
# jabrown93/AURA/.releaserc.js for the richest example (weekly dependency
# roll-up, :edge tag, manual re-publish escape hatch) this was modeled on.
name: Release

on:
  workflow_call:
    inputs:
      image:
        description: Full image ref to build, e.g. ghcr.io/jabrown93/crosswatch
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile
        required: false
        type: string
        default: ./Dockerfile
      context:
        description: Docker build context
        required: false
        type: string
        default: .
      platforms:
        description: Comma-separated target platforms
        required: false
        type: string
        default: linux/amd64,linux/arm64
      build-args:
        description: >-
          Extra newline-separated build-args, appended after the automatic
          APP_VERSION=v<version> arg.
        required: false
        type: string
        default: ""
      extra-plugins:
        description: >-
          Newline-separated extra semantic-release plugins (beyond the
          commit-analyzer/release-notes-generator/changelog/git/github the
          action ships with), e.g. @semantic-release/exec@7.
        required: false
        type: string
        default: ""
    secrets:
      APP_ID:
        description: GitHub App ID used to mint the release token
        required: true
      APP_PRIVATE_KEY:
        description: GitHub App private key
        required: true

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    # Skip only on our own [skip ci] version-bump commits. github.event.head_commit
    # is unset on non-push events (schedule/dispatch), so this is safe there too.
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      contents: write # push the version-bump commit, create the tag + GitHub Release
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      channel: ${{ steps.semantic.outputs.new_release_channel }}
    steps:
      # Mint the release app token + check out the branch TIP (fetch-depth 0).
      # semantic-release pushes the version-bump commit + tag AS this app, and
      # the branch ruleset grants that app bypass so the unsigned bump commit
      # clears required signatures / status checks while ordinary contributors
      # stay gated. release-checkout also pulls the branch tip (not github.sha)
      # so a queued run's push isn't rejected as non-fast-forward.
      #
      # Referenced by FULL pinned ref, not ./actions/release-checkout: a local
      # `./` ref used from inside a reusable workflow resolves against the
      # CALLER's checkout, not this repo, so it would not be found.
      - name: Release checkout
        id: rc
        uses: jabrown93/ci/actions/release-checkout@e24efb41d2e9a9f32af4521567f59911f2bbf7f4 # release-checkout-v1.0.1
        with:
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Exports RELEASE_COMMIT_SCRIPT for a .releaserc exec prepareCmd that
      # creates the version-bump commit via the GitHub API (Verified) instead
      # of @semantic-release/git. Unused by configs that don't reference it.
      - name: Stage release-commit script
        uses: jabrown93/ci/actions/release-commit@03c962b18c0808de575db8251919e34083513387 # release-commit-v1.0.0

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: ${{ inputs.extra-plugins }}
        env:
          # App token (not the default GITHUB_TOKEN) so the tag + GitHub
          # Release are created by the app the branch ruleset allows to bypass.
          GITHUB_TOKEN: ${{ steps.rc.outputs.token }}
          # Read by a consumer's .releaserc.js to promote suppressed fix(deps)
          # commits (routine dependency bumps) into a single patch release on
          # the caller's weekly schedule trigger, instead of on every push.
          # Also true on workflow_dispatch, so a manually-triggered run (e.g.
          # to sweep a non-default release branch a schedule can't reach) acts
          # as an on-demand version of the same promotion. A consumer without
          # that opt-in config simply ignores this. See the README's "Weekly
          # dependency releases" section.
          RELEASE_DEPS: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  image:
    name: Build & push image
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.release.outputs.published == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ${{ inputs.image }}
      VERSION: ${{ needs.release.outputs.version }}
      CHANNEL: ${{ needs.release.outputs.channel }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the tag semantic-release just created, not the pushed
          # commit, so the image matches exactly what was released.
          ref: v${{ env.VERSION }}
          persist-credentials: false

      - name: Plan tags
        id: meta
        run: |
          if [[ "${CHANNEL}" == "beta" ]]; then
            tags="${IMAGE}:beta,${IMAGE}:v${VERSION}"
          else
            tags="${IMAGE}:latest,${IMAGE}:v${VERSION}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        # No `platforms:` input: this action's platforms are binfmt arch
        # names (e.g. arm64,riscv64), not the Buildx OCI target descriptors
        # (linux/arm64) `inputs.platforms` holds, so it defaults to `all`.
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          platforms: ${{ inputs.platforms }}
          build-args: |
            APP_VERSION=v${{ env.VERSION }}
            ${{ inputs.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -z "${DIGEST}" ]; then
            echo "::error::build-push-action produced no digest; cannot sign image" >&2
            exit 1
          fi
          cosign sign --yes "${IMAGE}@${DIGEST}"

      # buildx `sbom: true` above already attached an SPDX SBOM -- BuildKit's
      # attestation is SPDX-only and cannot emit CycloneDX. This adds the
      # CycloneDX half, so both formats hang off the same digest.
      #
      # syft resolves a multi-arch index to one manifest, so the CycloneDX SBOM
      # describes a single architecture while buildx's SPDX is per-platform.
      # Acceptable: these images differ only by compiled arch, not package set.
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          # syft's file-metadata cataloger defaults to `owned-by-package`, which emits a
          # CycloneDX `type: file` component -- name, sha1, sha256, no purl, no license --
          # for every package-owned file in the image. They cannot match a vulnerability
          # and cannot carry a license, so they are pure ballast: measured elsewhere at
          # 7,265 of 7,506 components on one image and 15,521 of 16,399 on another.
          SYFT_FILE_METADATA_SELECTION: none
          # Go modules, npm packages and Python distributions frequently ship no license
          # metadata syft can read from the image alone, so they arrive with no license.
          # Enrichment resolves them from the upstream registries at scan time.
          # Best-effort: an unreachable registry degrades license coverage rather than
          # failing the build.
          SYFT_ENRICH: golang,javascript,python
          # Pinned, not corrective. `enrich: python` feeds one switch to two settings --
          # remote license lookup AND guess-unpinned-requirements, which invents a
          # version for each unpinned requirements.txt entry and would feed fabricated
          # versions into vulnerability matching. Today it cannot reach that setting,
          # but the asymmetry looks accidental, so the value is made explicit here.
          SYFT_PYTHON_GUESS_UNPINNED_REQUIREMENTS: 'false'
        with:
          # Digest, never the tag: the tag can move between the push and this scan.
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Attach CycloneDX SBOM attestation (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${IMAGE}@${DIGEST}"
